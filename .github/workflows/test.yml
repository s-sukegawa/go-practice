name: Test

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build dev image
        run: docker build -t go-hello-server-dev .devcontainer

      - name: Run tests
        run: docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace go-hello-server-dev go test ./...
